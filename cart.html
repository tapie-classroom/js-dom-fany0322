<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>장바구니</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <header>
    <h1 id="shop">Vintage Town</h1>
    <div>
      <span>여성</span>
      <span>남성</span>
      <span>신상</span>
      <span>세일</span>
    </div>
  </header>

  <div class="cart-container">
    <h2>장바구니</h2>
    
    <p id="empty-message" class="empty-message">장바구니가 비어 있습니다.</p>
    <div id="cart-items" class="cart-items" style="display: none;">
    </div>

    <div id="total" class="total" style="display: none;">
      총 합계: <strong>₩0</strong>
    </div>
    <button id="clear-cart" class="clear-cart">장바구니 초기화</button> 
  </div>

  <script src="script.js"></script>
</body>
</html>
