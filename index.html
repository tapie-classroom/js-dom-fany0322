<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SHOP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Vintage Town</h1>
        <div class="menu">
          <span>여성</span>
          <span>남성</span>
          <span>신상</span>
          <span>세일</span>
          <button id="cart"><i class="fas fa-shopping-cart"></i></button>
        </div>
    </header>
    <div class="product-grid">
        <div class="card" id="adidas">
          <img src="https://m.vintageenjoy.co.kr/web/product/big/F9876.JPG" alt="옷1">
          <h2>아디다스 트랙탑 와플 바켄바우어 져지</h2>
          <p>₩190,000</p>
          <button>상세보기</button>
        </div>
        <div class="card"  id="supreme">
          <img src="https://img.croket.co.kr/item/thumbnail/263e2173a064d8e5235ec70b93c699eb.webp" alt="옷2">
          <h2>슈프림 후드티</h2>
          <p>₩340,000</p>
          <button>상세보기</button>
        </div>
        <div class="card" id="stussy">
          <img src="https://img.danawa.com/prod_img/500000/161/490/img/20490161_1.jpg?_v=20230609172156" alt="옷3">
          <h2>스투시 월드투어 티셔츠</h2>
          <p>₩125,000</p>
          <button>상세보기</button>
        </div>
        <div class="card" id="patagonia">
          <img src="https://image.sivillage.com/upload/C00001/goods/org/538/230630005576538.jpg?RS=750&SP=1" alt="옷4">
          <h2>파타고니아 반팔 화이트</h2>
          <p>₩69,000</p>
          <button>상세보기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
