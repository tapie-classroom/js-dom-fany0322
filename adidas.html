<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>옷 정보</title>
  <link rel="stylesheet" href="clothes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <h1 id="shop">Vintage Town</h1>
    <div>
      <span>여성</span>
      <span>남성</span>
      <span>신상</span>
      <span>세일</span>
      <button id="cart"><i class="fas fa-shopping-cart"></i></button>
    </div>
  </header>
  
  <div class="container">
    <div class="img">
      <img src="https://m.vintageenjoy.co.kr/web/product/big/F9876.JPG" >
    </div>
    <div class="info">
      <h2 id="product-name">아디다스 트랙탑 와플 바켄바우어 져지</h2>
      <p id="product-price">₩190,000</p>
      <p>Adidas Waffle Beckenbauer Track Top Wonder White - KR Sizing</p>
      <span>색상: 하양</span>
      <span>사이즈: S,M,L,XL</span>

      <div class="cart">
        <button id="add-to-cart">장바구니에 추가</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
